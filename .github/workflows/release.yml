name: Publish Stable Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish-stable:
    uses: hatlabs/shared-workflows/.github/workflows/publish-stable.yml@main
    with:
      apt-distro: trixie
      apt-component: hatlabs
    secrets:
      APT_REPO_PAT: ${{ secrets.APT_REPO_PAT }}

  npm-publish:
    runs-on: ubuntu-latest
    # Only publish stable releases, not pre-releases
    if: ${{ github.event.release.prerelease == false }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned npm with trusted publishing support
        # Pin via corepack rather than `npm install -g npm@latest` so a broken
        # bundled npm in the Node toolcache (e.g. the MODULE_NOT_FOUND
        # `promise-retry` regression seen in Node 22.22.2) cannot fail the
        # install step.
        run: |
          corepack enable
          corepack prepare npm@11.14.1 --activate
          npm --version

      - name: Check if version exists on npm
        id: check
        run: |
          VERSION=$(cat VERSION)
          if npm view signalk-halpi@"$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already published to npm, skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not found on npm, will publish"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and publish to npm
        if: steps.check.outputs.exists == 'false'
        run: |
          npm ci --ignore-scripts
          npm run build
          npm publish --provenance --access public
